name: Build Desktop Installers (Electron)

# Produces the real installers via electron-builder:
#   Windows -> NSIS Setup .exe   macOS (Apple Silicon) -> .dmg
# On a v* tag it publishes them to the GitHub release (electron-updater reads
# these). On a manual run it uploads them as workflow artifacts only.
#
# Two platforms, deliberately. A release page that lists an installer per
# platform per architecture plus loose binaries is a page nobody can pick from;
# this ships one obvious download for Windows and one for a Mac.
#
# Why CI and not a local build: the Windows NSIS step needs symlink-creation
# privilege (Developer Mode / admin) to unpack the code-sign toolkit, and a
# macOS .dmg can only be built on a mac runner. CI runners have both; a normal
# Windows dev box has neither. The local `npm run build:win -- --dir` still
# produces a runnable unpacked app for testing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # npm@11 is pinned for the same reason release.yml pins it: `npm ci`
      # VALIDATES the lockfile rather than resolving it, and npm 10 rejects a
      # lock written by 11 with "Missing: utf-8-validate from lock file" (ws's
      # optional peers). Without this pin every runner aborts before building.
      # --ignore-scripts: never run dependency install scripts on the runner
      # (a malicious postinstall would run with the release token). The uuid
      # override (package.json) keeps @solana/web3.js's rpc-websockets working
      # under Electron's Node without native builds.
      - name: Install dependencies
        run: |
          npm i -g npm@11
          npm ci --ignore-scripts

      - name: Build engine + UI
        run: npm run build

      - name: Run tests
        run: npm run test:all

      # Signing is opt-in: when the signing secrets are present in the repo they
      # are used; otherwise electron-builder produces an UNSIGNED installer (the
      # local dev/testing case). Do not force-sign, so a fork without certs can
      # still build.
      # CSC_LINK / CSC_KEY_PASSWORD are deliberately NOT set here. Passing
      # `${{ secrets.CSC_LINK }}` when the secret does not exist sets it to an
      # EMPTY STRING, and electron-builder then treats "" as a certificate path
      # and dies with "<repo root> not a file" on macOS. Unsigned builds must
      # leave the vars undefined entirely.
      #
      # To sign later: add the CSC_LINK (base64 .pfx / .p12) and CSC_KEY_PASSWORD
      # secrets and re-add them to this env block, plus APPLE_ID,
      # APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID for macOS notarization.
      - name: Build & publish installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >
          npx electron-builder ${{ matrix.args }}
          ${{ startsWith(github.ref, 'refs/tags/') && '--publish always' || '--publish never' }}

      - name: Upload installers as artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release-app/*.exe
            release-app/*.dmg
          if-no-files-found: ignore
